name: Keep awake

# Pings the site's /healthz address every 10 minutes, 7am-5pm UK time, Monday to Friday, so the
# free hosting does not go to sleep during the school day. Because it also runs on weekdays in
# school holidays, the free database never sits idle long enough to pause.
# Needs one repository variable: SITE_URL (Settings > Secrets and variables > Actions >
# Variables), e.g. https://your-app.onrender.com - without it this job does nothing.

on:
  schedule:
    # GitHub schedules use UTC. This covers 7am-5pm UK time in both winter (UTC) and summer (BST);
    # the step below skips any run that falls outside 7am-5pm UK time.
    - cron: '*/10 6-16 * * 1-5'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          uk_hour=$(TZ=Europe/London date +%-H)
          if [ "$EVENT" = "schedule" ] && { [ "$uk_hour" -lt 7 ] || [ "$uk_hour" -ge 17 ]; }; then
            echo "It is ${uk_hour}:xx in the UK - outside 7am-5pm, skipping."
            exit 0
          fi
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set - nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors "${SITE_URL%/}/healthz"
          echo
