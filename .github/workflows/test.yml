name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:////tmp/class_compass_test.db
      SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m compileall -q app tests
      - name: Application smoke test
        run: python -c "from app import create_app; app=create_app('development'); assert app.url_map"

  intervention-postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fictional-ci-only
          POSTGRES_DB: class_compass_intervention_migration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/test_intervention_migration.py -q
        env:
          CC_TEST_POSTGRES_URL: postgresql+psycopg://postgres:fictional-ci-only@127.0.0.1:5432/class_compass_intervention_migration_test

  intervention-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/test_intervention_browser.py -q
      - name: Fictional UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: intervention-ui-check
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
