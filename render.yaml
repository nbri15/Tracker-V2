services:
  - type: web
    name: tracker-v2
    env: python
    plan: starter
    # Schema changes and the idempotent question-bank refresh complete before
    # Gunicorn starts. Application startup itself never creates or seeds data.
    buildCommand: pip install -r requirements.txt && flask --app wsgi:app db upgrade && flask --app wsgi:app fundamentals seed
    startCommand: gunicorn wsgi:app --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tracker-v2-db
          property: connectionString

databases:
  - name: tracker-v2-db
    plan: starter
