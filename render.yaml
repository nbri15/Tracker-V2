services:
  - type: web
    name: tracker-v2
    env: python
    plan: starter
    # Importing the application before its Alembic schema is current can make
    # SQLAlchemy select model columns that an older production database lacks.
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn wsgi:app --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tracker-v2-db
          property: connectionString

databases:
  - name: tracker-v2-db
    plan: starter
