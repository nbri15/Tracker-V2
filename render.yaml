services:
  - type: web
    name: tracker-v2
    env: python
    plan: starter
    # Schema changes are completed before Gunicorn starts. Application startup
    # itself never creates tables or seeds the Fundamentals question bank.
    buildCommand: pip install -r requirements.txt && flask --app wsgi:app db upgrade
    startCommand: gunicorn wsgi:app --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tracker-v2-db
          property: connectionString

databases:
  - name: tracker-v2-db
    plan: starter
