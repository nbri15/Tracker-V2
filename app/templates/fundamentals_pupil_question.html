<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maths Question</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary-subtle">
  <main class="container py-5 text-center">
    <div class="card mx-auto shadow" style="max-width:46rem">
      <div class="card-body p-5">
        <div class="h2 mb-2">
          Level {{ attempt.current_level }}: {{ current_level_obj.skill }}
        </div>
        <div class="text-muted mb-4">
          Question {{ answered_this_level + 1 }} of 10
        </div>
        <div class="display-5 mb-4" style="white-space:pre-line">{{ question.question_text }}</div>
        <form method="post">
          <input type="hidden" name="question_db_id" value="{{ question.id }}">
          <input class="form-control form-control-lg text-center mb-4" name="answer" autocomplete="off" autofocus required>
          <button class="btn btn-success btn-lg px-5">Submit</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
