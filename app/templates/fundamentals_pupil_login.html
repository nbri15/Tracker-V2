<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maths Fundamentals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
  <div class="card mx-auto" style="max-width:42rem">
    <div class="card-body p-4">
      <h1>Maths Fundamentals</h1>
      <p class="lead mb-1">{{ session.strand.name }}</p>
      <p class="text-muted">{{ session.school_class.name }}</p>
      {% include 'partials/flash_messages.html' %}
      {% if not pupils %}
        <div class="alert alert-info">No pupils are currently available for this assessment.</div>
      {% else %}
        <form method="post" id="fundamentals-join-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label class="form-label" for="pupil_id">Name</label>
          <select id="pupil_id" name="pupil_id" class="form-select form-select-lg mb-3" required>
            <option value="">Choose your name</option>
            {% for pupil in pupils %}<option value="{{ pupil.id }}">{{ pupil.full_name }}</option>{% endfor %}
          </select>
          <button class="btn btn-primary btn-lg w-100">Start</button>
        </form>
      {% endif %}
    </div>
  </div>
</main>
</body>
</html>
