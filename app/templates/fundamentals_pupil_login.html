<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maths Fundamentals</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5"><div class="card mx-auto" style="max-width:42rem"><div class="card-body p-4"><h1>Maths Fundamentals</h1>{% include 'partials/flash_messages.html' %}{% if no_session %}<div class="alert alert-info">Your teacher has not started a Maths Fundamentals assessment yet.</div>{% endif %}<form method="get" class="mb-4"><label class="form-label">Class</label><select name="class_id" class="form-select" onchange="this.form.submit()"><option value="">Choose your class</option>{% for class in classes %}<option value="{{ class.id }}" {% if selected_class_id==class.id %}selected{% endif %}>{{ class.name }}</option>{% endfor %}</select></form><form method="post"><input type="hidden" name="class_id" value="{{ selected_class_id or '' }}"><label class="form-label">Name</label><select name="pupil_id" class="form-select mb-3" required>{% for pupil in pupils %}<option value="{{ pupil.id }}">{{ pupil.full_name }}</option>{% endfor %}</select><label class="form-label">Password</label><input class="form-control form-control-lg mb-3" name="password" type="password" required><button class="btn btn-primary btn-lg w-100">Start</button></form></div></div></main></body></html>
